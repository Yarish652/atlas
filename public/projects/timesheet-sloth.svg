<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550">
  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: 'Space Grotesk', 'Inter', system-ui, 'Segoe UI', Arial, sans-serif; }
  </style>
  <rect width="880" height="550" fill="#1b1a17"/>

  <!-- Header -->
  <text x="60" y="66" class="mono" font-size="14" letter-spacing="2.4" fill="#8b887f">LOCAL ACTIVITYWATCH AGENT</text>
  <text x="820" y="66" class="mono" font-size="14" fill="#8b887f" text-anchor="end"><tspan fill="#d9540f">●</tspan> nothing leaves your machine</text>

  <!-- Terminal: the standup it writes -->
  <rect x="60" y="96" width="470" height="262" rx="14" fill="#23221e" stroke="#34322c"/>
  <text x="84" y="134" class="mono" font-size="15" fill="#d9540f">$</text>
  <text x="102" y="134" class="mono" font-size="15" fill="#f2efe6">sloth standup</text>

  <text x="84" y="176" class="mono" font-size="12" letter-spacing="1.6" fill="#8b887f">DONE</text>
  <text x="160" y="176" class="mono" font-size="14" fill="#d8d4c9">OCR ingestion shipped · 2h 10m</text>
  <text x="84" y="208" class="mono" font-size="12" letter-spacing="1.6" fill="#8b887f">FOCUS</text>
  <text x="160" y="208" class="mono" font-size="14" fill="#d8d4c9">4 blocks · 1h 52m deep work</text>
  <text x="84" y="240" class="mono" font-size="12" letter-spacing="1.6" fill="#8b887f">NEXT</text>
  <text x="160" y="240" class="mono" font-size="14" fill="#d8d4c9">resume pdfAnalyzer in Code</text>

  <!-- A day of focus, in half-hour blocks -->
  <g fill="#3a3832">
    <rect x="84" y="300" width="14" height="30" rx="2"/>
    <rect x="102" y="312" width="14" height="18" rx="2"/>
    <rect x="120" y="306" width="14" height="24" rx="2"/>
    <rect x="138" y="316" width="14" height="14" rx="2"/>
    <rect x="228" y="310" width="14" height="20" rx="2"/>
    <rect x="246" y="318" width="14" height="12" rx="2"/>
    <rect x="300" y="304" width="14" height="26" rx="2"/>
    <rect x="390" y="314" width="14" height="16" rx="2"/>
    <rect x="408" y="308" width="14" height="22" rx="2"/>
    <rect x="426" y="318" width="14" height="12" rx="2"/>
    <rect x="444" y="312" width="14" height="18" rx="2"/>
    <rect x="462" y="320" width="14" height="10" rx="2"/>
    <rect x="480" y="316" width="14" height="14" rx="2"/>
  </g>
  <g fill="#f2efe6">
    <rect x="156" y="292" width="14" height="38" rx="2"/>
    <rect x="210" y="296" width="14" height="34" rx="2"/>
    <rect x="264" y="290" width="14" height="40" rx="2"/>
    <rect x="282" y="298" width="14" height="32" rx="2"/>
    <rect x="336" y="294" width="14" height="36" rx="2"/>
    <rect x="372" y="300" width="14" height="30" rx="2"/>
  </g>
  <g fill="#d9540f">
    <rect x="174" y="276" width="14" height="54" rx="2"/>
    <rect x="192" y="282" width="14" height="48" rx="2"/>
    <rect x="318" y="280" width="14" height="50" rx="2"/>
    <rect x="354" y="286" width="14" height="44" rx="2"/>
  </g>

  <!-- While you're away: the suggestion it prepares -->
  <rect x="556" y="96" width="264" height="262" rx="14" fill="#23221e" stroke="#34322c"/>
  <text x="580" y="134" class="mono" font-size="12" letter-spacing="1.6" fill="#8b887f">WHILE YOU'RE AWAY</text>
  <text x="580" y="174" class="sans" font-size="17" fill="#f2efe6">Evening sessions that</text>
  <text x="580" y="198" class="sans" font-size="17" fill="#f2efe6">start with Work focus</text>
  <text x="580" y="262" class="sans" font-size="44" font-weight="700" fill="#d9540f">7% → 44%</text>
  <text x="580" y="296" class="mono" font-size="13" fill="#8b887f">from 39 sessions</text>
  <text x="580" y="330" class="mono" font-size="13" fill="#d8d4c9">ready when you sit down</text>

  <!-- Name -->
  <text x="58" y="450" class="sans" font-size="64" font-weight="700" fill="#f2efe6">Timesheet Sloth</text>
  <text x="60" y="496" class="mono" font-size="16" fill="#d9540f">activitywatch → tabpfn → gemma 4 → your standup</text>
  <text x="820" y="450" class="mono" font-size="14" fill="#8b887f" text-anchor="end">zero cloud calls</text>
</svg>
